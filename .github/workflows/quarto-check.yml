name: Quarto Render Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Quarto check
        run: quarto check

      - name: Execute notebooks
        run: |
          jupyter nbconvert --to notebook --execute notebooks/01-exhibition.ipynb --output 01-exhibition.executed.ipynb
          jupyter nbconvert --to notebook --execute notebooks/02-artworks.ipynb --output 02-artworks.executed.ipynb

      - name: Render manuscript project
        run: quarto render
